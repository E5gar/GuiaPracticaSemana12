<div class="field{% if field.errors %} has-error{% endif %}">
    {% if field.field.widget.input_type == 'checkbox' %}
        <label class="check-label">{{ field }}<span>{{ field.label }}</span></label>
    {% else %}
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
    {% endif %}
    {% if field.help_text %}<p class="field-help">{{ field.help_text }}</p>{% endif %}
    {% for error in field.errors %}
        <p class="field-error" role="alert"><i data-lucide="circle-alert"></i>{{ error }}</p>
    {% endfor %}
</div>
