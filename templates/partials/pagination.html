{% if page_obj.has_other_pages %}
<nav class="pagination" aria-label="Paginación">
    {% if page_obj.has_previous %}
        <a class="page-link" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.previous_page_number }}" aria-label="Página anterior"><i data-lucide="arrow-left"></i></a>
    {% endif %}
    <span class="page-status">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
        <a class="page-link" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.next_page_number }}" aria-label="Página siguiente"><i data-lucide="arrow-right"></i></a>
    {% endif %}
</nav>
{% endif %}
