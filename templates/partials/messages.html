{% if messages %}
<div class="toast-stack" role="status" aria-live="polite">
    {% for message in messages %}
    <div class="toast toast-{{ message.level_tag }}" data-toast>
        {% if message.level_tag == 'error' %}<i data-lucide="circle-alert"></i>{% elif message.level_tag == 'success' %}<i data-lucide="circle-check"></i>{% else %}<i data-lucide="info"></i>{% endif %}
        <span>{{ message }}</span>
    </div>
    {% endfor %}
</div>
{% endif %}
