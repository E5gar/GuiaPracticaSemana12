{% extends 'base.html' %}
{% block title %}Eliminar evento{% endblock %}
{% block content %}
<section class="container section narrow">
    <p class="index-label">[01] Confirmación</p>
    <h1 class="display-lg">¿Eliminar <em>este evento?</em></h1>
    <p class="lead">Se eliminarán también las inscripciones y reacciones de "{{ object.title }}". Esta acción no se puede deshacer.</p>
    <form method="post" class="row row-wrap form-top">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit"><i data-lucide="trash-2"></i>Sí, eliminar</button>
        <a class="btn btn-soft" href="{{ object.get_absolute_url }}">Cancelar</a>
    </form>
</section>
{% endblock %}
